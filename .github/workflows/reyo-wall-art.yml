name: Generate Reyo Listing Images

on:
  workflow_dispatch:
  push:
    paths:
      - 'reyo-wall-art/trigger.txt'
      - '.github/workflows/reyo-wall-art.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image dependencies
        run: pip install pillow opencv-python-headless numpy
      - name: Rebuild input package and generate images
        run: |
          cat reyo-wall-art/payload/part*.txt > /tmp/payload.b64
          base64 -d /tmp/payload.b64 > /tmp/reyo-inputs.zip
          rm -rf reyo-wall-art/input
          mkdir -p reyo-wall-art/input
          unzip -q /tmp/reyo-inputs.zip -d reyo-wall-art/input
          python reyo-wall-art/generate.py
      - name: Commit generated public JPGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reyo-wall-art/images
          git diff --cached --quiet || git commit -m "Generate Reyo A4 listing images"
          git push
